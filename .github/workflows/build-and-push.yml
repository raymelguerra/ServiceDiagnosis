name: Build and Push API Docker Image

on:
  push:
    branches:
      - dev

jobs:
  build-and-push-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.x'

      - name: Restore API dependencies
        run: dotnet restore ./CuallimexManagement/CuallimexManagement.csproj

      - name: Build API
        run: dotnet build ./CuallimexManagement/CuallimexManagement.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish ./CuallimexManagement/CuallimexManagement.csproj --configuration Release --no-build --output ./CuallimexManagement/out

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push API Docker Image
        run: |
          ls
          docker build -t raymelguerra/cuallimex-manager:${{ github.sha }} -f ./CuallimexManagement/Dockerfile .
          docker push raymelguerra/cuallimex-manager:${{ github.sha }}

          # Tag with "latest"
          docker tag raymelguerra/cuallimex-manager:${{ github.sha }} raymelguerra/cuallimex-manager:latest
          docker push raymelguerra/cuallimex-manager:latest
